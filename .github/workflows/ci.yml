name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile application
        run: python -m py_compile weather_app.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check CLI help
        run: python weather_app.py --help

      - name: Check CLI version
        run: python weather_app.py --version
